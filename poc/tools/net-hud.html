<style>
#zone{top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);text-align:center;display:grid;gap:2px;border-radius:16px;padding:8px 18px}
#zone b{font-family:var(--display);font-weight:700;font-size:17px}
#zone span{font-size:12.5px;color:var(--ink-soft)}
#board{position:fixed;z-index:5;top:calc(12px + env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));border-radius:18px;padding:10px 14px;min-width:180px;font-size:13px;display:grid;gap:4px;background:rgba(255,255,255,.92);box-shadow:0 3px 0 rgba(20,60,140,.25);pointer-events:none}
#board h3{margin:0 0 2px;font-family:var(--display);font-weight:600;font-size:14px}
#board .r{display:flex;gap:8px;align-items:center;font-weight:700}
#board .r i{width:10px;height:10px;border-radius:50%;flex:none}
#board .r em{margin-left:auto;font-style:normal;font-variant-numeric:tabular-nums}
#board .zz{opacity:.5}
#feed{position:fixed;z-index:5;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px;align-items:flex-end;pointer-events:none;max-width:min(360px,70vw)}
#feed div{background:rgba(255,255,255,.94);border-radius:14px;padding:6px 12px;font-size:13px;font-weight:700;box-shadow:0 3px 0 rgba(20,60,140,.2)}
#help{position:fixed;z-index:5;left:max(12px,env(safe-area-inset-left,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));background:rgba(255,255,255,.92);border-radius:16px;padding:8px 14px;font-size:12.5px;line-height:1.5;font-weight:700;box-shadow:0 3px 0 rgba(20,60,140,.2);pointer-events:none}
#help kbd{font-family:var(--display);background:var(--pill-2);border-radius:6px;padding:0 6px}
#login{position:fixed;inset:0;z-index:30;display:none;place-items:center;background:rgba(63,184,255,.45)}
#login .card{background:#fff;border-radius:24px;padding:26px 30px;text-align:center;box-shadow:0 6px 0 rgba(20,60,140,.3);display:grid;gap:12px;justify-items:center;max-width:320px}
#login h1{margin:0;font-family:var(--display);font-weight:700;font-size:40px;color:var(--candy)}
#login p{margin:0;font-weight:700;color:var(--ink-soft)}
#login input{font-family:var(--display);font-size:18px;padding:10px 14px;border-radius:14px;border:3px solid #FFC93C;width:220px;text-align:center;color:var(--ink);outline:none}
#login button{font-size:18px;padding:10px 24px;background:var(--candy);color:#fff}
#status{position:fixed;z-index:25;left:50%;top:50%;transform:translate(-50%,-50%);background:#fff;border-radius:18px;padding:12px 20px;font-family:var(--display);font-weight:600;font-size:18px;box-shadow:0 4px 0 rgba(20,60,140,.3);display:none}
.pop.say{color:var(--ink);font-size:20px;-webkit-text-stroke:4px #fff}
.pop.honk{color:#E8343F;font-size:30px}
@media (pointer:coarse){ #help{display:none} }
@media (max-width:640px){ #board{display:none} #zone{top:calc(64px + env(safe-area-inset-top,0px))} }
#gear{position:fixed;z-index:8;right:max(12px,env(safe-area-inset-right,0px));top:calc(64px + env(safe-area-inset-top,0px));width:40px;height:40px;padding:0;font-size:20px;line-height:40px;background:rgba(255,255,255,.92);box-shadow:0 3px 0 rgba(20,60,140,.25)}
#fpsMeter{position:fixed;z-index:8;right:max(12px,env(safe-area-inset-right,0px));top:calc(112px + env(safe-area-inset-top,0px));background:rgba(255,255,255,.85);border-radius:10px;padding:2px 8px;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;display:none;pointer-events:none}
#settings{position:fixed;inset:0;z-index:28;display:none;place-items:center;background:rgba(46,35,80,.35);backdrop-filter:blur(3px)}
#settings .card{background:#fff;border-radius:24px;padding:20px 22px 16px;box-shadow:0 6px 0 rgba(20,60,140,.3);width:min(460px,calc(100vw - 32px));max-height:calc(100vh - 48px);display:grid;grid-template-rows:auto auto 1fr auto;gap:12px;overflow:hidden}
#settings h2{margin:0;font-family:var(--display);font-weight:700;font-size:26px;color:var(--candy)}
#settings .stabs{display:flex;gap:6px;flex-wrap:wrap}
#settings .stabs button.on{background:var(--candy);color:#fff}
#settings .swrap{overflow-y:auto;min-height:0}
#settings .spane{display:grid;gap:10px;align-content:start;padding:2px 4px 2px 0;min-height:200px}
#settings .spane[hidden]{display:none}
#settings .srow{display:grid;grid-template-columns:1fr 64px;gap:2px 10px;align-items:center;font-weight:700;font-size:14px}
#settings .srow label{grid-column:1/-1}
#settings .srow input[type=range]{width:100%;accent-color:#FF6E9E}
#settings .srow output{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-soft)}
#settings .srow select{grid-column:1/-1;font:inherit;padding:6px 10px;border-radius:12px;border:2px solid var(--pill-2);color:var(--ink);background:#fff}
#settings .srow.chk{grid-template-columns:1fr}
#settings .srow.chk input{accent-color:#FF6E9E;width:18px;height:18px;vertical-align:-3px;margin:0 6px 0 0}
#settings .binds h4{margin:6px 0 4px;font-family:var(--display);font-weight:600;font-size:15px}
#settings .binds h4 small{font-family:var(--body);font-weight:700;font-size:11.5px;color:var(--ink-soft)}
#settings .brow{display:flex;align-items:center;justify-content:space-between;font-weight:700;font-size:14px;padding:3px 0}
#settings .brow button{min-width:110px}
#settings .brow button.wait{background:#FFC93C}
#settings .sfoot{display:flex;gap:8px;justify-content:space-between}
#settings #sResume{background:var(--candy);color:#fff;font-size:16px;padding:9px 22px}
</style>
<div class="hud chip" id="zone"><b id="zoneName">Sunnyside</b><span id="zoneOwner">nobody owns this turf</span></div>
<div id="board"><h3>Vagrants</h3><div id="rows"></div></div>
<div id="feed"></div>
<div id="help">Click to look around · <kbd>WASD</kbd> walk · <kbd>Shift</kbd> run · <kbd>Space</kbd> jump<br><kbd>E</kbd> pick up junk or do the thing · click throws it · <kbd>Q</kbd> drop · <kbd>F</kbd> light it · <kbd>G</kbd> drag<br>Close the tab and your vagrant lies down right where you are.</div>
<div id="status"></div>
<div id="login"><div class="card"><h1>Turf War</h1><p>Pick a name, vagrant.</p><input id="nameInput" maxlength="16" placeholder="Sunny Steve" autocomplete="off"><button type="button" id="go">Wake up</button></div></div>
<button type="button" id="gear" title="Settings (Esc)" aria-label="Settings">⚙</button>
<div id="fpsMeter"></div>
<div id="settings" role="dialog" aria-label="Settings"><div class="card">
<h2>Settings</h2>
<div class="stabs"><button type="button" class="on" data-t="controls">Controls</button><button type="button" data-t="video">Video</button><button type="button" data-t="audio">Audio</button><button type="button" data-t="hud">HUD</button></div>
<div class="swrap"><div class="spane" id="sp_controls"></div><div class="spane" id="sp_video" hidden></div><div class="spane" id="sp_audio" hidden></div><div class="spane" id="sp_hud" hidden></div></div>
<div class="sfoot"><button type="button" id="sReset">Reset to defaults</button><button type="button" id="sResume">Back to the streets</button></div>
</div></div>
